name: ISO week 53 four-PR comparison
on:
  push:
    branches: [research/iso-week53-four-pr-comparison]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: [1457, 1506, 1551, 1582]
    steps:
      - name: Checkout upstream PR code
        uses: actions/checkout@v4
        with:
          repository: dateutil/dateutil
          ref: refs/pull/${{ matrix.pr }}/head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest hypothesis
      - name: Run isoparser tests
        run: python -m pytest tests/test_isoparser.py -q
      - name: Exhaustive ISO week comparison
        run: |
          python - <<'PY'
          from datetime import date
          from dateutil.parser import isoparse
          count = 0
          for year in range(2000, 2400):
              for week in range(1, 54):
                  for day in range(1, 8):
                      text = f"{year}-W{week:02d}-{day}"
                      try:
                          expected = date.fromisocalendar(year, week, day)
                      except ValueError:
                          try:
                              got = isoparse(text).date()
                          except ValueError:
                              pass
                          else:
                              raise AssertionError((text, "expected rejection", got))
                      else:
                          actual = isoparse(text).date()
                          assert actual == expected, (text, actual, expected)
                      count += 1
          print(f"PASS: {count} comparisons, 400 years x 53 weeks x 7 days")
          PY

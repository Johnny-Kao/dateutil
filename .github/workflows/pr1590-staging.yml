name: "dateutil #1590 staging validation"

on:
  push:
    branches:
      - staging/pr1590-clean-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr1590-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TZ: ${{ matrix.os != 'windows-latest' && 'America/New_York' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Use upstream's pinned tzdb 2024a on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lzip
          curl --fail --location https://data.iana.org/time-zones/releases/tzdb-2024a.tar.lz -o tzdb.tar.lz
          tar --lzip -xf tzdb.tar.lz
          mkdir -p tzdata_built
          make -C tzdb-2024a install DESTDIR="$PWD/tzdata_built" DATAFORM=main
          sudo rm -rf /usr/share/zoneinfo
          sudo mv tzdata_built/usr/share/zoneinfo /usr/share/zoneinfo
      - name: Install test requirements
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Full upstream tests and docs
        run: python -m pytest -q tests docs
      - name: Differential, roundtrip, and benchmark (same runner)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python ci_tools/pr1590_staging_verify.py

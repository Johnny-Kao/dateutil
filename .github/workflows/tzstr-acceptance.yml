name: tzstr upstream acceptance audit
on:
  push:
    branches: [research/tzstr-upstream-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pr: [1453, 1530, 1563]
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.9', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dateutil/dateutil
          ref: refs/pull/${{ matrix.pr }}/head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies with upstream pytest behavior
        run: |
          python -m pip install -e .
          python -m pip install 'pytest==7.4.4' hypothesis pytest-cov
          python -m pip install --no-deps 'freezegun==1.5.5'
          python - <<'PY'
          import dateutil, pathlib
          p=pathlib.Path(dateutil.__file__).resolve()
          print('TESTED DATEUTIL SOURCE:',p)
          assert str(pathlib.Path.cwd().resolve()) in str(p), ('Wrong package installed',p)
          PY
      - name: Full test suite with compatible pytest
        id: full
        continue-on-error: true
        run: python -m pytest tests -q --tb=short -W ignore::UserWarning -W ignore::DeprecationWarning
      - name: Full suite result
        run: 'echo "Full suite outcome: ${{ steps.full.outcome }}"'
      - name: Focused tzstr suite
        id: tz
        continue-on-error: true
        run: python -m pytest tests/test_tz.py -q -m tzstr --tb=short -W ignore::UserWarning -W ignore::DeprecationWarning
      - name: Focused result
        run: 'echo "Focused result: ${{ steps.tz.outcome }}"'
      - name: Changelog review
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path("changelog.d").glob("*")) if Path("changelog.d").exists() else []
          relevant=[p for p in files if p.is_file() and ("1402" in p.name or "1432" in p.name or "tzstr" in p.read_text(errors="replace").lower())]
          for p in relevant:
              print("FRAGMENT",p,repr(p.read_text(errors="replace")[:400]))
          print("Relevant fragments",len(relevant))
          PY
  formatter:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pr: [1453, 1530, 1563]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dateutil/dateutil
          ref: refs/pull/${{ matrix.pr }}/head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Darker 1.7.2 check
        run: |
          python -m pip install 'darker==1.7.2' 'black==26.5.1'
          darker --check src/dateutil/tz/tz.py tests/test_tz.py
